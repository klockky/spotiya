name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Rust, controls and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopus-dev pkg-config shellcheck
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            youtube/target
          key: checks-${{ runner.os }}-rust-1.98.0-${{ hashFiles('Cargo.lock', 'youtube/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PYVERSION'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == "v" + version, "Release tag must match Cargo.toml"
          PYVERSION
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check the YouTube add-on
        run: |
          cargo fmt --manifest-path youtube/Cargo.toml -- --check
          cargo clippy --locked --manifest-path youtube/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path youtube/Cargo.toml
      - name: Read pinned librespot revision
        id: librespot
        run: |
          python3 - <<'PYREVISION'
          import os, pathlib, tomllib
          source = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["dependencies"]["librespot"]
          assert source["git"] == "https://github.com/klockky/librespot.git"
          revision = source["rev"]
          assert len(revision) == 40 and all(c in "0123456789abcdef" for c in revision)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("revision=" + revision + "\n")
          PYREVISION
      - name: Checkout pinned librespot for dependency tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: klockky/librespot
          ref: ${{ steps.librespot.outputs.revision }}
          path: .cache/librespot
          persist-credentials: false
      - name: Check patched Spotify authentication, keys and discovery
        run: |
          cargo fmt --manifest-path .cache/librespot/Cargo.toml -p librespot-core -p librespot-audio -p librespot-discovery -- --check
          cargo clippy --locked --manifest-path .cache/librespot/Cargo.toml -p librespot-core -p librespot-audio -p librespot-discovery --no-default-features --features librespot-core/rustls-tls-webpki-roots,librespot-audio/rustls-tls-webpki-roots,librespot-discovery/rustls-tls-webpki-roots --all-targets -- -D warnings
          cargo test --locked --manifest-path .cache/librespot/Cargo.toml -p librespot-core -p librespot-audio -p librespot-discovery --no-default-features --features librespot-core/rustls-tls-webpki-roots,librespot-audio/rustls-tls-webpki-roots,librespot-discovery/rustls-tls-webpki-roots --lib
      - run: make -C controls/mini2 check
      - name: Check Soloist spectrum adapter
        run: |
          cc -std=gnu99 -O2 -Wall -Wextra -Werror soloist/test-apulse-spectrum.c -lm -o /tmp/test-apulse-spectrum
          /tmp/test-apulse-spectrum
      - run: shellcheck install.sh scripts/*.sh packaging/*.sh packaging/S99spotify-connect soloist/*.sh
      - run: python3 -m py_compile bin/spotiya airplay/build.py airplay/fetch.py airplay/package.py youtube/package.py soloist/build.py soloist/package.py soloist/prepare.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  arm:
    name: ARMv7 / glibc 2.23
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config curl bzip2 xz-utils qemu-user
      - run: rustup toolchain install 1.98.0 --profile minimal --target armv7-unknown-linux-gnueabihf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/spotiya
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arm-${{ runner.os }}-rust-1.98.0-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/bootstrap-arm.sh') }}
      - run: scripts/bootstrap-arm.sh
      - run: scripts/build-arm.sh
      - run: scripts/smoke-arm.sh
      - run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spotiya-armv7-linux-gnueabihf
          path: |
            dist/spotiya-armv7-linux-gnueabihf.tar.gz
            dist/SHA256SUMS
            dist/install.sh
            dist/INSTALL_SHA256SUMS
          if-no-files-found: error

  airplay:
    name: Optional AirPlay 2 / ARMv7
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config curl bzip2 xz-utils cmake autoconf automake libtool libtool-bin gettext flex bison texinfo libplist-utils xxd patch
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/spotiya
          key: airplay-arm-${{ runner.os }}-${{ hashFiles('airplay/**', 'scripts/bootstrap-arm.sh') }}
      - run: scripts/bootstrap-arm.sh
      - run: scripts/build-airplay.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spotiya-airplay2-armv7
          path: |
            dist/spotiya-airplay2-armv7.tar.gz
            dist/AIRPLAY_SHA256SUMS
          if-no-files-found: error

  youtube:
    name: Optional YouTube / ARMv7
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config curl bzip2 xz-utils cmake
      - run: rustup toolchain install 1.98.0 --profile minimal --target armv7-unknown-linux-gnueabihf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/spotiya
            ~/.cargo/registry
            ~/.cargo/git
            youtube/target
          key: youtube-arm-${{ runner.os }}-rust-1.98.0-${{ hashFiles('youtube/Cargo.lock', 'rust-toolchain.toml', 'scripts/bootstrap-arm.sh') }}
      - run: scripts/bootstrap-arm.sh
      - run: scripts/build-youtube.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spotiya-youtube-armv7
          path: |
            dist/spotiya-youtube-armv7.tar.gz
            dist/YOUTUBE_SHA256SUMS
          if-no-files-found: error

  soloist:
    name: Soloist compatibility only / ARMv7
    runs-on: ubuntu-24.04
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config curl bzip2 xz-utils patch
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/spotiya
          key: soloist-compat-arm-${{ runner.os }}-${{ hashFiles('soloist/**', 'controls/alsa_compat.c', 'scripts/bootstrap-arm.sh') }}
      - run: scripts/bootstrap-arm.sh
      - run: python3 soloist/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spotiya-soloist-compat-armv7
          path: |
            dist/spotiya-soloist-compat-armv7.tar.gz
            dist/SOLOIST_SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish tag release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arm, airplay, youtube, soloist]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: spotiya-armv7-linux-gnueabihf
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: spotiya-airplay2-armv7
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: spotiya-youtube-armv7
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: spotiya-soloist-compat-armv7
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
