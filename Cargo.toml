[package]
name = "spotiya"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Spotify Connect and voice control for Yandex Stations"
repository = "https://github.com/klockky/spotiya"
publish = false

[dependencies]
librespot = { version = "=0.8.0", default-features = false, features = ["alsa-backend", "with-libmdns", "rustls-tls-webpki-roots"] }
alsa = "0.10"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "vorbis", "aac", "alac", "isomp4", "ogg", "wav", "pcm"] }
md5 = "0.7"

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0

[profile.dev]
debug = 0
