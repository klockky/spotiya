[package]
name = "spotiya"
version = "0.9.4"
edition = "2024"
license = "MIT"
description = "Spotify Connect and voice control for Yandex Stations"
repository = "https://github.com/klockky/spotiya"
publish = false

[dependencies]
librespot = { git = "https://github.com/klockky/librespot.git", rev = "ebacab525375858be6932cbc6c9867d74c957f7a", version = "=0.8.0", default-features = false, features = ["alsa-backend", "with-libmdns", "rustls-tls-webpki-roots"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false }
alsa = "0.10"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt", "process", "macros", "signal", "sync", "time"] }

sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
ruzstd = { version = "0.7", default-features = false, features = ["std"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
aes = "0.8"
ctr = "0.9"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0

[profile.dev]
debug = 0
